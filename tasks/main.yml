---
- name: Install dependencies
  become: yes
  apt:
    pkg: [ca-certificates, default-jre-headless, libzookeeper-mt-dev]
    update_cache: yes
    cache_valid_time: 3600

- name: Create User
  become: yes
  user: name="{{ zookeeper_user }}" system=yes shell=/bin/bash

- name: Check installation
  stat: path="/opt/{{ zookeeper_filename }}"
  register: zookeeper_installed

- name: Download
  become: yes
  get_url:
    url: "{{ zookeeper_url }}/zookeeper-{{ zookeeper_version }}/{{ zookeeper_filename }}{{ zookeeper_filename_extension }}"
    dest: "/tmp/{{ zookeeper_filename }}{{ zookeeper_filename_extension }}"
    checksum: "sha512:{{ zookeeper_url }}/zookeeper-{{ zookeeper_version }}/{{ zookeeper_filename }}{{ zookeeper_filename_extension }}.sha512"
  when: not zookeeper_installed.stat.exists

- name: Unarchive
  become: yes
  unarchive:
    src: "/tmp/{{ zookeeper_filename }}{{ zookeeper_filename_extension }}"
    dest: /opt
    remote_src: yes
  when: not zookeeper_installed.stat.exists

- name: Remove tmp files
  become: yes
  file: path="/tmp/{{ zookeeper_filename }}{{ zookeeper_filename_extension }}" state=absent

- name: Apply permissions into unarchived file
  become: yes
  file: path="/opt/{{ zookeeper_filename }}" owner="{{ zookeeper_user }}" recurse=yes

- name: Link folder
  become: yes
  file: src="/opt/{{ zookeeper_filename }}" dest="{{ zookeeper_path }}" state=link
  notify: restart zookeeper

- name: Create /var folders
  become: yes
  file: path="{{ item }}" owner="{{ zookeeper_user }}" group="{{ zookeeper_user }}" state=directory
  loop:
    - "{{ zookeeper_var_path }}"
    - "{{ zookeeper_var_path }}/data"
    - /var/log/zookeeper

- name: Create config files
  become: yes
  copy:
    src: "{{ zookeeper_path }}/conf/{{ item.src }}"
    dest: "{{ zookeeper_var_path }}/{{ item.dest }}"
    remote_src: yes
    force: no
    owner: "{{ zookeeper_user }}"
    group: "{{ zookeeper_user }}"
  loop:
    - { src: zoo_sample.cfg, dest: zoo.cfg }
    - { src: logback.xml, dest: logback.xml }

- name: Set config file parameters
  become: yes
  lineinfile:
    path: "{{ zookeeper_var_path }}/zoo.cfg"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: dataDir, value: "{{ zookeeper_var_path }}/data" }
    - { key: clientPort, value: "{{ zookeeper_port }}" }
  notify: restart zookeeper

- name: Install systemd unit
  become: yes
  template: src=zookeeper.service.j2 dest=/etc/systemd/system/zookeeper.service mode=0644
  notify: restart zookeeper

- name: Ensure ZooKeeper is started and enabled
  become: yes
  systemd: name=zookeeper state=started enabled=yes daemon_reload=yes
